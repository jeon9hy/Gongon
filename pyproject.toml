[project]
name = "gongon"
version = "0.1.0"
description = "공온: 기상 영향 기반 현장 작업 운영 서비스 (규칙 기반 공종별 판정 + 현장 알림)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "rfc3339-validator>=0.1.4",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# 배포용 패키지가 아니라 단일 앱 저장소다. engine/·app/은 저장소 루트에서 import한다.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--strict-markers", "--import-mode=importlib"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
# DTZ: 시간대 없는 datetime 사용을 막는다(시각 계약 원칙).
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DTZ", "RUF"]
# 시간 범위는 화면 시안대로 EN DASH(07:00–17:00)를 쓴다.
ignore = ["RUF001"]

[tool.ruff.lint.per-file-ignores]
# 예시 데이터는 한 줄에 한 행이 보여야 읽기 쉽다.
"app/features/*/sample.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
# 새 최상위 패키지(engine/ 등)가 생겨도 검사 대상에서 빠지지 않도록 루트 전체를 본다.
files = ["."]
# tests/에 __init__.py가 없어도 tests.fakes처럼 저장소 루트 기준 모듈 이름을 쓴다.
explicit_package_bases = true
exclude = ['^\.venv/', '^migrations/']
