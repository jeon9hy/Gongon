{% extends "auth/_shell.html" %}
{% block title %}가입{% endblock %}
{% block content %}
<form class="form auth-form" method="post" action="/signup">
<div class="auth-form__head">
<h1 class="auth-form__title">공온 시작하기</h1>
<p class="auth-form__lead">1분이면 첫 현장까지 열려요.</p>
</div>
{% include "auth/_errors.html" %}
<input type="hidden" name="next" value="{{ view.next_path }}">
<label class="field">이메일
<input type="email" name="email" value="{{ view.email }}" placeholder="name@company.com" autocomplete="username" maxlength="200" required>
</label>
<label class="field">휴대폰 번호
<input type="tel" name="phone" value="{{ view.phone }}" placeholder="010-0000-0000" autocomplete="tel" inputmode="tel" maxlength="20" required>
</label>
<div class="auth-form__row">
<label class="field">이름
<input type="text" name="display_name" value="{{ view.display_name }}" autocomplete="name" maxlength="40" required>
</label>
<label class="field">회사 이름
<input type="text" name="organization_name" value="{{ view.organization_name }}" autocomplete="organization" maxlength="60" required>
</label>
</div>
<label class="field"><span>비밀번호 <small class="muted">10자 이상</small></span>
<input type="password" name="password" autocomplete="new-password" minlength="10" maxlength="128" required>
</label>
<p class="auth-form__note">현장은 참여자로 추가된 사람만 볼 수 있어요.<br>같은 회사여도 자동으로 열리지 않아요.</p>
<button class="btn btn--accent btn--lg" type="submit">가입하고 시작하기</button>
<p class="auth-form__switch">이미 가입했어요 · <a href="/login?next={{ view.next_path | urlencode }}">로그인</a></p>
</form>
{% endblock %}
