{% extends "auth/_shell.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<form class="form auth-form" method="post" action="/login">
<div class="auth-form__head">
<h1 class="auth-form__title">다시 오셨네요!</h1>
<p class="auth-form__lead">로그인하고 현장을 켜 볼까요?</p>
</div>
{% include "auth/_errors.html" %}
<input type="hidden" name="next" value="{{ view.next_path }}">
<label class="field">이메일
<input type="email" name="email" value="{{ view.email }}" placeholder="name@company.com" autocomplete="username" maxlength="200" required autofocus>
</label>
<label class="field">비밀번호
<input type="password" name="password" autocomplete="current-password" maxlength="128" required>
</label>
<button class="btn btn--accent btn--lg" type="submit">로그인</button>
<p class="auth-form__switch">처음이세요? <a href="/signup?next={{ view.next_path | urlencode }}">가입하기</a></p>
</form>
{% endblock %}
