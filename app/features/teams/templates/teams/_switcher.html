{% from "_macros.html" import icon %}
{# 머리줄 현장 고르기 칩의 목록(C04-33 N4). 칩을 처음 누를 때 불러온다. 주소는 스크립트가 지금 화면에 맞춘다 #}
<ul class="siteswitch__list">
<li><a class="siteswitch__item siteswitch__item--all" href="/" data-switch-all><span class="siteswitch__dot" aria-hidden="true">{{ icon("site", 14) }}</span><span class="siteswitch__name">전체 현장</span></a></li>
{% for s in sites %}<li><a class="siteswitch__item" href="/?site_id={{ s.site_id }}" data-switch-site="{{ s.site_id }}" data-name="{{ s.name }}"><span class="siteswitch__dot" aria-hidden="true">{{ s.name[:1] }}</span><span class="siteswitch__name" title="{{ s.name }}">{{ s.name }}</span></a></li>
{% else %}<li class="siteswitch__empty">참여한 현장이 없어요</li>{% endfor %}
</ul>
<div class="siteswitch__foot">
<button type="button" class="siteswitch__action" data-site-dialog="/sites?embed=1" data-title="현장 추가">{{ icon("plus", 15, 2.2) }} 현장 추가</button>
<a class="siteswitch__gear" href="/sites" data-switch-settings aria-label="현장 설정" title="현장 설정">{{ icon("gear", 16) }}</a>
</div>
