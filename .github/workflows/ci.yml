name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "rules/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # 로컬 검증과 같은 스크립트를 실행한다(docs/setup.md).
      - run: uv run python scripts/check.py
