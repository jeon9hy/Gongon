name: ci

on:
  push:
    branches: [main, "feature/**", "fix/**", "rules/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # DB 테스트용. 시연 배포(Supabase)와 같은 주 버전(D-014).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gongon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gongon_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # 로컬 검증과 같은 스크립트를 실행한다(docs/setup.md).
      - run: uv run python scripts/check.py
