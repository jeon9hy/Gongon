# 콘크리트 타설 판정 기준(D-033, D-080). 형식: rules/steel.yaml과 같고 app/core/rules.py가 검증한다.
# 원문(발췌·해시):
# - 강우: 국토교통부 「강우 시 콘크리트 타설을 위한 가이드라인」(2024.12) 1.1(1)·2.1(2) — sources/kcs_concrete.json(공식 PDF)
# - 서중: KCS 14 20 41:2025 서중콘크리트 1.1(2) — sources/kcs_concrete.json(공식 PDF)
# - 한중: KCS 14 20 40:2024 한중 콘크리트 1.1(2) — sources/kcs_weather.json(국가건설기준센터 OpenAPI)
# 시방서는 작업 중지 의무가 아니라 시공 방법(서중·한중 대책)을 정하므로 기온 조건은 확인 필요다.
# 강우: 가이드라인이 '강우 시 타설은 금지가 원칙'이라 비가 오면 중지 검토(D-081). 3mm 초과는 즉시 중지 조치.
# 화면 사유는 같은 요소에서 처음 해당한 조건을 보여 주므로 더 엄격한 조건을 먼저 둔다.
# quote·값·단위·이상/초과가 원문과 같은지 tests/engine/judgment/test_rule_sources.py가 검사한다.
work_type: concrete
work_type_label: 콘크리트 타설
rule_version: "KCS 14 20 41·40 · 강우지침 2024.12 · D-081"
source: KCS 14 20 41:2025 서중, KCS 14 20 40:2024 한중, 국토교통부 강우 시 콘크리트 타설 가이드라인(2024.12)
source_snapshot: [sources/kcs_concrete.json, sources/kcs_weather.json]
source_articles:
  - 국토교통부 강우 시 콘크리트 타설을 위한 가이드라인 1.1(1)
  - 국토교통부 강우 시 콘크리트 타설을 위한 가이드라인 2.1(2)
  - KCS 14 20 41 1.1(2)
  - KCS 14 20 40 1.1(2)
source_verified: true
verified_on: 2026-10-17
conditions:
  - id: concrete_rain_stop
    element: precipitation_mm_per_h
    operator: ">"
    threshold: 3.0
    verdict: 중지 검토
    forecast_comparable: true
    cite: 강우 타설 가이드라인 2.1(2)
    action: 보호조치 없으면 즉시 중지
    quote: 시간당 강우량이 3mm를 초과하는 경우에는 구조체 콘크리트의 강도저하가 허용치를 초과하므로 적절한 수분 유입 방지 조치를 취하지 않는 한 타설을 즉시 중지하고 적절한 보호조치를 취하여야 한다.
  - id: concrete_rain
    element: precipitation_mm_per_h
    operator: ">"
    threshold: 0.0
    verdict: 중지 검토
    forecast_comparable: true
    cite: 강우 타설 가이드라인 1.1(1)
    action: 강우 시 타설 원칙 금지
    quote: 강우 시 콘크리트 타설은 수분의 유입에 의한 강도저하가 우려되므로 금지하는 것이 원칙이다.
  - id: concrete_hot_mean
    element: daily_mean_temperature_c
    operator: ">"
    threshold: 25.0
    verdict: 확인 필요
    forecast_comparable: true
    cite: KCS 14 20 41 1.1(2)
    action: 서중 콘크리트로 시공
    quote: 타설일의 일 평균기온이 25 ℃를 초과하거나, 콘크리트 타설 완료 후 24시간 이내에 일 최고기온이 30 ℃를 초과할 것이예상되는 경우 서중 콘크리트로 시공하여야 한다.
  - id: concrete_hot_max
    element: max_temperature_next_24h_c
    operator: ">"
    threshold: 30.0
    verdict: 확인 필요
    forecast_comparable: true
    cite: KCS 14 20 41 1.1(2)
    action: 서중 콘크리트로 시공
    quote: 타설일의 일 평균기온이 25 ℃를 초과하거나, 콘크리트 타설 완료 후 24시간 이내에 일 최고기온이 30 ℃를 초과할 것이예상되는 경우 서중 콘크리트로 시공하여야 한다.
  - id: concrete_cold_mean
    element: daily_mean_temperature_c
    operator: "<="
    threshold: 4.0
    verdict: 확인 필요
    forecast_comparable: true
    cite: KCS 14 20 40 1.1(2)
    action: 한중 콘크리트로 시공
    quote: 타설일의 일평균기온이 4 ℃ 이하 또는 콘크리트 타설 완료 후 24시간 동안 일최저기온 0 ℃ 이하가 예상되는 조건이거나 그 이후라도 초기동해 위험이 있는 경우 한중 콘크리트로 시공하여야 한다.
  - id: concrete_cold_min
    element: min_temperature_next_24h_c
    operator: "<="
    threshold: 0.0
    verdict: 확인 필요
    forecast_comparable: true
    cite: KCS 14 20 40 1.1(2)
    action: 한중 콘크리트로 시공
    quote: 타설일의 일평균기온이 4 ℃ 이하 또는 콘크리트 타설 완료 후 24시간 동안 일최저기온 0 ℃ 이하가 예상되는 조건이거나 그 이후라도 초기동해 위험이 있는 경우 한중 콘크리트로 시공하여야 한다.
