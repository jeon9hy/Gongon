# 콘크리트 타설 판정 기준(D-033). 형식: 서비스_개발_총정리.md §4.3.
# 확보한 공식 원문(발췌·해시: sources/kcs_concrete.json):
# - 강우: 국토교통부 「강우 시 콘크리트 타설을 위한 가이드라인」(2024.12) 1.1(1)·2.1(2)
# - 서중: KCS 14 20 41:2025 서중콘크리트 1.1(2)·1.3(일평균기온 정의)
# 한중(KCS 14 20 40) 원문은 아직 확보하지 못했다(국가건설기준센터는 브라우저로만 열림).
# 그래서 기준표 전체를 원문 대조 전(source_verified: false)으로 두고, 한중 조건은 확인 필요까지만 낸다.
# 시방서는 작업 중지 의무가 아니라 시공 방법(서중·한중 대책)을 정하므로 기온 조건은 확인 필요다.
# 화면 사유는 같은 요소에서 처음 해당한 조건을 보여 주므로 더 엄격한 조건을 먼저 둔다.
work_type: concrete
work_type_label: 콘크리트 타설
rule_version: "KCS 14 20 41:2025 · 강우 가이드라인 2024.12"
source: KCS 14 20 41:2025, 국토교통부 강우 시 콘크리트 타설 가이드라인(2024.12), KCS 14 20 40(원문 대조 필요)
source_verified: false
conditions:
  - id: concrete_rain_stop
    element: precipitation_mm_per_h
    operator: ">"
    threshold: 3.0
    verdict: 중지 검토
    forecast_comparable: true
    action: 수분 유입 방지 조치 없이는 타설 즉시 중지·보호조치(가이드라인 2.1(2))
    quote: 시간당 강우량이 3mm를 초과하는 경우에는 구조체 콘크리트의 강도저하가 허용치를 초과하므로 적절한 수분 유입 방지 조치를 취하지 않는 한 타설을 즉시 중지하고 적절한 보호조치를 취하여야 한다.
  - id: concrete_rain
    element: precipitation_mm_per_h
    operator: ">"
    threshold: 0.0
    verdict: 확인 필요
    forecast_comparable: true
    action: 강우 시 타설은 원칙적으로 금지 · 부득이하면 가이드라인 조치(타설 계획서·수분 유입 방지)
    quote: 강우 시 콘크리트 타설은 수분의 유입에 의한 강도저하가 우려되므로 금지하는 것이 원칙이다.
  - id: concrete_hot_mean
    element: daily_mean_temperature_c
    operator: ">"
    threshold: 25.0
    verdict: 확인 필요
    forecast_comparable: true
    action: 서중 콘크리트로 시공(KCS 14 20 41)
    quote: 타설일의 일 평균기온이 25 ℃를 초과하거나, 콘크리트 타설 완료 후 24시간 이내에 일 최고기온이 30 ℃를 초과할 것이예상되는 경우 서중 콘크리트로 시공하여야 한다.
  - id: concrete_hot_max
    element: max_temperature_next_24h_c
    operator: ">"
    threshold: 30.0
    verdict: 확인 필요
    forecast_comparable: true
    action: 서중 콘크리트로 시공(KCS 14 20 41)
    quote: 타설일의 일 평균기온이 25 ℃를 초과하거나, 콘크리트 타설 완료 후 24시간 이내에 일 최고기온이 30 ℃를 초과할 것이예상되는 경우 서중 콘크리트로 시공하여야 한다.
  # [원문 대조 필요] KCS 14 20 40 한중콘크리트: 일평균기온 4℃ 이하 예상 시 한중 콘크리트로 시공(2차 자료).
  # 이하/미만, 24시간 이내 최저기온 0℃ 조건 여부는 원문으로 확인한다.
  - id: concrete_cold_mean
    element: daily_mean_temperature_c
    operator: "<="
    threshold: 4.0
    verdict: 확인 필요
    forecast_comparable: true
    action: 한중 콘크리트 대책 검토(KCS 14 20 40, 원문 대조 필요)
