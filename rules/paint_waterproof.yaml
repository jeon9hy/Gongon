# 도장·방수 판정 기준(D-080). 원문: 국가건설기준센터 OpenAPI 발췌(sources/kcs_weather.json).
# - KCS 41 47 00:2023 도장공사 3.2.17: 아래 조건이면 "담당원이 승인할 때까지 도장해서는 안 된다" → 중지 검토.
#   (1) 기온 5 ℃ 미만, 상대습도 85% 초과, 눈·비, 안개. 재료·제조업자 설계도서에 따로 정하면 예외.
# - KCS 41 40 01:2021 방수공사일반 3.5: 강우·강설(예상 포함)은 담당원과 협의, 5 ℃ 미만·바탕 동결은 원칙적으로 시공 안 함.
#   같은 요소에서 도장 조건(중지 검토)이 더 엄격해 그것을 쓰고, 방수의 협의 절차는 조치 문구에 함께 적는다.
# 안개는 단기예보에 없는 요소라 판정하지 않는다(현장 확인). 바탕 온도·이슬점도 예보로 알 수 없다.
