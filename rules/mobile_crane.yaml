# 이동식 크레인 판정 기준(D-080). 장비별 허용풍속(제조사 설명서)은 법령·KCS에 수치가 없어 여기서 쓰지 않는다.
# 원문(국가법령정보센터 Open API 발췌):
# - 산업안전보건기준에 관한 규칙 제37조①: 비·눈·바람 등 기상상태 불안정으로 위험해질 우려가 있으면 작업 중지
# - 기상법 시행령 별표 1(특보의 기준) 강풍주의보: 육상에서 풍속 14m/s 이상(평균풍속 — 예보와 같은 양)
# 강풍주의보 기준 풍속을 '바람으로 위험해질 우려'의 공식 수준으로 보고 중지 검토로 둔다.
# 비·눈은 법령에 수치가 없어 확인 필요까지만 낸다. 순간풍속(주의보 20m/s)은 예보에 없어 쓰지 않는다.
work_type: mobile_crane
work_type_label: 이동식 크레인
