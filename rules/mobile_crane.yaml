    quote: 육상에서 풍속 50.4km/h(14m/s) 이상
  - id: mobile_crane_rain
    element: precipitation_mm_per_h
    operator: ">"
    threshold: 0.0
    verdict: 확인 필요
    forecast_comparable: true
    action: 비로 위험해질 우려가 있으면 작업 중지(제37조①) · 현장 판단
    quote: 사업주는 비ㆍ눈ㆍ바람 또는 그 밖의 기상상태의 불안정으로 인하여 근로자가 위험해질 우려가 있는 경우 작업을 중지하여야 한다.
  - id: mobile_crane_snow
