# 고소작업대 판정 기준(D-080). 장비별 허용풍속(제조사 설명서)은 법령·KCS에 수치가 없어 여기서 쓰지 않는다.
# 원문(국가법령정보센터 Open API 발췌):
# - 산업안전보건기준에 관한 규칙 제37조①: 비·눈·바람 등 기상상태 불안정으로 위험해질 우려가 있으면 작업 중지
# - 기상법 시행령 별표 1(특보의 기준) 강풍주의보: 육상에서 풍속 14m/s 이상(평균풍속 — 예보와 같은 양)
# 판정 강도(D-081, 개발자 결정): 작업이 어려울 게 분명하면 중지 검토로 거른다. 이 공종의 법정 수치가 없어
# 같은 고소·양중 성격인 철골 작업의 중지 기준(제383조: 풍속 10m/s·강우 1mm/h·강설 1cm/h 이상)을 준용한다.
# 그보다 약한 비·눈('1mm 미만' 등)만 제37조①로 확인 필요. 순간풍속은 예보에 없어 쓰지 않는다.
