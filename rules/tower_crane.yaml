# 타워크레인 운전 판정 기준. 형식: 서비스_개발_총정리.md §4.3, 원문 대조: D-026.
# 법령은 순간풍속, 단기예보 WSD는 평균풍속이다. 순간풍속은 평균풍속보다 작지 않으므로 예보가 기준을 넘으면
